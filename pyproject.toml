[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rupay"
version = "0.1.0"
description = "Единая Python-библиотека для работы с российскими платежными системами (ЮMoney, QIWI, Tinkoff)"
readme = "README.md"
authors = [
    {name = "rupay contributors"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
keywords = ["payment", "yoomoney", "qiwi", "tinkoff", "russia", "acquiring", "payments"]
requires-python = ">=3.7"
dependencies = [
    "requests>=2.25.0",
    "aiohttp>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.18.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.900",
]

[project.urls]
Homepage = "https://github.com/shutkashutka3-rgb/rupay"
Documentation = "https://github.com/shutkashutka3-rgb/rupay#readme"
Repository = "https://github.com/shutkashutka3-rgb/rupay"
Issues = "https://github.com/shutkashutka3-rgb/rupay/issues"

